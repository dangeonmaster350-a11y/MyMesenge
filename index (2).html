<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlapNet Protocol — Личный кабинет</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/pubnub@7.2.2/dist/web/pubnub.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');
        .font-mono-premium {
            font-family: 'JetBrains Mono', monospace;
        }
    
        .premium-rainbow{
            background: linear-gradient(90deg,#ff0000,#ff8800,#ffee00,#00ff66,#00ccff,#0066ff,#cc00ff,#ff0000);
            background-size:400%;
            animation:rainbowMove 8s linear infinite;
        }

        @keyframes rainbowMove{
            0%{background-position:0%;}
            100%{background-position:400%;}
        }
</style>
</head>
<body class="bg-[#07090e] m-0 p-0 font-sans antialiased text-gray-200 select-none overflow-hidden">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [loginInput, setLoginInput] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [activeTab, setActiveTab] = useState('profile');
            const [marketSubTab, setMarketSubTab] = useState('gifts'); 

            const [showPremium, setShowPremium] = useState(false);
            const [mainNumber, setMainNumber] = useState('+888 0000 0000');
            const [ownedUsernames, setOwnedUsernames] = useState([]);

            const TON_LOGO = 'https://assets.crypto.ro/logos/toncoin-ton-logo.png';


            // Состояния админа
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminPanel, setShowAdminPanel] = useState(false);
            const [hasTick, setHasTick] = useState(false);
            const [verificationType, setVerificationType] = useState('none'); 

            // Данные профиля
            const [username, setUsername] = useState('');
            const [phone, setPhone] = useState('');
            const [bio, setBio] = useState('');
            const [avatar, setAvatar] = useState('');
            const [stars, setStars] = useState(15000); 
            const [tonBalance, setTonBalance] = useState(120.50);

            // КОЛЛЕКЦИЯ КУПЛЕННЫХ NFT
            const [ownedGifts, setOwnedGifts] = useState([]);

            // Редактирование
            const [isEditingName, setIsEditingName] = useState(false);
            const [isEditingPhone, setIsEditingPhone] = useState(false);
            const [isEditingBio, setIsEditingBio] = useState(false);

            // Обычные чаты
            const [currentChatId, setCurrentChatId] = useState('cloud');
            const [chatsList, setChatsList] = useState([
                { id: 'cloud', name: '☁️ Личное Облако', lastMsg: 'Сохраняйте здесь файлы' },
                { id: 'support', name: '👨‍💻 Поддержка FlapNet', lastMsg: 'Чем могу помочь?' }
            ]);
            const [message, setMessage] = useState('');
            const [allChatsMessages, setAllChatsMessages] = useState({
                cloud: [{ id: 1, user: 'Система', text: 'Это ваше личное безопасное облако FlapNet.' }],
                support: [{ id: 1, user: 'Агент', text: 'Здравствуйте! Задайте ваш вопрос.' }]
            });

            // Система уведомлений (Логи)
            const [notifications, setNotifications] = useState([
                { id: 1, time: 'Системное время', text: 'Протокол безопасности FlapNet успешно инициализирован. Добро пожаловать.' }
            ]);

            const fileInputRef = useRef(null);

            const triggerNotification = (text) => {
                const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                setNotifications(prev => [
                    ...prev, 
                    { id: Date.now(), time: now, text: text }
                ]);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const trimmed = loginInput.trim();
                
                if (trimmed === 'vibes') {
                    if (password === '44076511') {
                        setUsername('vibes');
                        setAvatar('https://i.imgur.com/8Q5N8S6.jpeg');
                        setBio('хуй');
                        setPhone('+7 (777) 777-77-77');
                        setStars(56333332);
                        setTonBalance(8888.88);
                        setIsAdmin(true);
                        setHasTick(true);
                        setVerificationType('major');
                        setIsLoggedIn(true);
                        setError('');
                        setTimeout(() => triggerNotification('Вы авторизовались как Создатель (vibes). Права Администратора предоставлены.'), 300);
                    } else {
                        setError('КРИТИЧЕСКАЯ ОШИБКА: Доступ к ядру vibes заблокирован.');
                    }
                } else {
                    setUsername(trimmed);
                    setAvatar(''); 
                    setBio('Информация отсутствует');
                    setPhone('Не привязан');
                    setStars(5000); 
                    setTonBalance(50.00);
                    setIsAdmin(false);
                    setHasTick(false);
                    setVerificationType('none');
                    setIsLoggedIn(true);
                    setError('');
                    setTimeout(() => triggerNotification(`Создан новый сессионный аккаунт @${trimmed}.`), 300);
                }
            };

            const handleActionGiveTon = () => {
                const userTarget = prompt("Введите никнейм пользователя, кому выдать TON:");
                if (!userTarget) return;
                const amount = parseFloat(prompt(`Сколько TON выдать пользователю ${userTarget}?`)) || 0;
                if (amount <= 0) return;
                
                if (userTarget.trim() === username) {
                    setTonBalance(prev => prev + amount);
                    triggerNotification(`Администратор зачислил на ваш баланс ${amount} TON.`);
                } else {
                    triggerNotification(`Успешно инициирован перевод ${amount} TON на удаленный адрес @${userTarget}.`);
                }
            };

            const handleActionGiveStars = () => {
                const userTarget = prompt("Введите никнейм пользователя, кому выдать Звёзды:");
                if (!userTarget) return;
                const amount = parseInt(prompt(`Сколько Звёзд выдать пользователю ${userTarget}?`)) || 0;
                if (amount <= 0) return;
                
                if (userTarget.trim() === username) {
                    setStars(prev => prev + amount);
                    triggerNotification(`На ваш баланс поступило начисление: +${amount} Telegram Stars.`);
                } else {
                    triggerNotification(`Выдано ${amount} звёзд для пользователя @${userTarget}.`);
                }
            };

            const handleGiveVerification = (typeLabel, typeValue) => {
                const userTarget = prompt(`Введите никнейм, кому выдать верификацию "${typeLabel}":`);
                if (!userTarget) return;

                if (userTarget.trim() === username) {
                    setVerificationType(typeValue);
                    triggerNotification(`Ваш статус верификации обновлен до уровня: [${typeLabel}]`);
                } else {
                    triggerNotification(`Запрос на статус верификации "${typeLabel}" направлен пользователю @${userTarget}.`);
                }
            };

            const toggleTickStatus = () => {
                const nextState = !hasTick;
                setHasTick(nextState);
                if (!nextState) {
                    triggerNotification("Ваша галочка была скрыта, обратитесь к администратору для более подробной информации.");
                } else {
                    triggerNotification("Система безопасности: Вам успешно присвоен статус подтвержденного аккаунта (Официальная галочка).");
                }
            };

            const purchaseMarketItem = (itemName, cost, currency, itemImg = null) => {
                if (currency === 'TON') {
                    if (tonBalance < cost) {
                        alert("Ошибка: Недостаточно TON на балансе кошелька.");
                        return;
                    }
                    setTonBalance(prev => Math.round((prev - cost) * 100) / 100);
                    if (itemImg) {
                        setOwnedGifts(prev => [...prev, { id: Date.now(), name: itemName, img: itemImg }]);
                    }
                    triggerNotification(`Успешная покупка на Fragment: вы приобрели лот "${itemName}" за ${cost} TON.`);
                } else if (currency === 'Stars') {
                    if (stars < cost) {
                        alert("Ошибка: Недостаточно Telegram Stars.");
                        return;
                    }
                    setStars(prev => prev - cost);
                    if (itemImg) {
                        setOwnedGifts(prev => [...prev, { id: Date.now(), name: itemName, img: itemImg }]);
                    }
                    triggerNotification(`Успешная транзакция: NFT-лот "${itemName}" куплен за ${cost} Stars.`);
                }
                alert(`Вы успешно приобрели: ${itemName}`);
            };

            const placeMarketBid = (itemName, minBid) => {
                triggerNotification(`Ваша ставка на аукционе Fragment по лоту "${itemName}" принята (${minBid} TON).`);
                alert(`Ставка принята: ${itemName}`);
            };

            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!message.trim()) return;
                
                const newMsg = { id: Date.now(), user: username, text: message };
                setAllChatsMessages(prev => ({ ...prev, [currentChatId]: [...(prev[currentChatId] || []), newMsg] }));
                setChatsList(prev => prev.map(c => c.id === currentChatId ? { ...c, lastMsg: message } : c));
                setMessage('');
            };

            if (!isLoggedIn) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#05070a] font-mono-premium">
                        <div className="w-full max-w-sm p-8 bg-[#0b0e14] border border-[#171e2c] rounded-lg shadow-[0_0_50px_rgba(0,0,0,0.8)] mx-4 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-blue-500/40 to-transparent"></div>
                            
                            <div className="text-center mb-8">
                                <div className="text-white text-xl font-bold tracking-[0.25em] uppercase mb-1">FLAPNET</div>
                                <p className="text-[#415373] text-[10px] tracking-widest uppercase">Secured Authentication Endpoint</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <label className="block text-[10px] font-bold text-[#415373] mb-2 uppercase tracking-wider">Ident_Node / Логин</label>
                                    <input 
                                        type="text" 
                                        value={loginInput} 
                                        onChange={(e) => setLoginInput(e.target.value)} 
                                        className="w-full px-4 py-3 bg-[#06080c] border border-[#171e2c] text-sm text-white focus:outline-none focus:border-blue-500/60 transition-colors font-mono-premium" 
                                        placeholder="root" 
                                        required 
                                    />
                                </div>
                                {loginInput.trim() === 'vibes' && (
                                    <div>
                                        <label className="block text-[10px] font-bold text-[#415373] mb-2 uppercase tracking-wider">Security token / Пароль</label>
                                        <input 
                                            type="password" 
                                            value={password} 
                                            onChange={(e) => setPassword(e.target.value)} 
                                            className="w-full px-4 py-3 bg-[#06080c] border border-[#171e2c] text-sm text-white focus:outline-none focus:border-blue-500/60 transition-colors font-mono-premium" 
                                            placeholder="••••••••" 
                                            required 
                                        />
                                    </div>
                                )}
                                {error && (
                                    <p className="text-red-400 text-[11px] bg-red-950/20 p-3 border border-red-900/30 font-mono-premium">
                                        {error}
                                    </p>
                                )}
                                <button type="submit" className="w-full py-3 bg-[#131924] hover:bg-blue-900/20 text-white border border-[#222c3f] hover:border-blue-500/30 text-xs font-bold tracking-widest uppercase transition-all">
                                    Establish Connection
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen w-full bg-[#07090e] text-white select-none font-mono-premium">
                    <input type="file" ref={fileInputRef} onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const r = new FileReader();
                            r.onloadend = () => { setAvatar(r.result); triggerNotification("Аватар профиля успешно изменен."); };
                            r.readAsDataURL(file);
                        }
                    }} accept="image/*" className="hidden" />

                    {/* Хедер */}
                    <header className="h-16 border-b border-[#121824] px-8 flex items-center justify-between bg-[#0b0e14]/60 flex-shrink-0">
                        <div className="flex items-center space-x-2">
                            <span className="text-base font-bold tracking-[0.2em] uppercase text-white">FlapNet</span>
                            <span className="text-[9px] px-1.5 py-0.5 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded font-bold uppercase">Core v4</span>
                        </div>
                        <div className="flex items-center space-x-4">
                            <button onClick={() => { setIsLoggedIn(false); setShowAdminPanel(false); }} className="px-4 py-1.5 bg-[#0b0e14] hover:bg-red-950/30 text-red-400 text-xs border border-[#171e2c] hover:border-red-900/40 transition-all font-bold uppercase tracking-wider">Выйти</button>
                        </div>
                    </header>

                    {/* Контент */}
                    <main className="flex-1 overflow-y-auto p-6 md:p-12 pb-28 flex justify-center items-start">
                        <div className="w-full max-w-5xl">
                            
                            {/* ВКЛАДКА ПРОФИЛЬ */}
                            {activeTab === 'profile' && !showAdminPanel && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-[#0b0e14] border border-[#121824] p-6 flex flex-col items-center justify-center shadow-xl h-fit relative">
                                            <div 
                                                onClick={() => fileInputRef.current.click()} 
                                                className="w-32 h-32 rounded-full border border-[#222c3f] overflow-hidden relative mb-6 shadow-lg cursor-pointer hover:opacity-80 transition-opacity flex items-center justify-center bg-[#07090e]"
                                            >
                                                {avatar ? (
                                                    <img src={avatar} alt="avatar" className="w-full h-full object-cover" />
                                                ) : (
                                                    <div className="text-2xl font-bold text-[#415373]">{username ? username.substring(0,2).toUpperCase() : '??'}</div>
                                                )}
                                            </div>
                                            <button onClick={() => fileInputRef.current.click()} className="px-4 py-2 bg-[#07090e] border border-[#171e2c] text-gray-400 text-xs font-bold hover:text-white transition-colors w-full uppercase tracking-wider">Изменить узел фото</button>
                                        </div>

                                        <div className="md:col-span-2 bg-[#0b0e14] border border-[#121824] p-6 shadow-xl space-y-4">
                                            <h3 className="text-sm font-bold tracking-widest text-[#415373] uppercase border-b border-[#121824] pb-3">Account Specifications</h3>
                                            <div className="space-y-3">
                                                
                                                {/* Никнейм */}
                                                <div className="bg-[#07090e] border border-[#121824] p-4 flex justify-between items-center">
                                                    <div className="flex-1 mr-4">
                                                        <p className="text-[10px] text-[#415373] font-bold uppercase tracking-wider mb-1">Никнейм / Статус верификации</p>
                                                        {isEditingName ? (
                                                            <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && setIsEditingName(false)} className="bg-[#05070a] border border-blue-500/40 px-2 py-1 text-white text-sm w-full focus:outline-none focus:border-blue-500 font-mono-premium"/>
                                                        ) : (
                                                            <div className="flex items-center space-x-2">
                                                                <span className={`font-bold text-base ${hasTick ? 'text-cyan-400' : 'text-white'}`}>{username}</span>
                                                                {hasTick && (
                                                                    <span className="text-blue-400 bg-blue-500/10 p-0.5 rounded-full flex items-center justify-center">
                                                                        <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                                                                    </span>
                                                                )}
                                                            </div>
                                                        )}
                                                        {verificationType === 'major' && <p className="text-[11px] text-emerald-400 mt-1">⚡ Verified Entity: Major Network</p>}
                                                        {verificationType === 'media' && <p className="text-[11px] text-cyan-400 mt-1">⭐ Verified Entity: Public Media Node</p>}
                                                        {verificationType === 'hold' && <p className="text-[11px] text-purple-400 mt-1">💎 Verified Entity: High-Volume Liquidity Holder</p>}
                                                        {verificationType === 'none' && <p className="text-[11px] text-gray-500 mt-1">Ожидание внешней валидации</p>}

                                                        <div className="mt-3 border-t border-[#121824] pt-3">
                                                            <p className="text-[10px] text-[#415373] font-bold uppercase tracking-wider mb-2">
                                                                USERNAMES
                                                            </p>

                                                            <div className="flex flex-wrap gap-2">
                                                                {ownedUsernames.length === 0 ? (
                                                                    <span className="text-gray-500 text-xs">
                                                                        Нет купленных username
                                                                    </span>
                                                                ) : (
                                                                    ownedUsernames.map((u,i)=>(
                                                                        <span
                                                                            key={i}
                                                                            className="px-2 py-1 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded text-xs"
                                                                        >
                                                                            @{u}
                                                                        </span>
                                                                    ))
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => setIsEditingName(!isEditingName)} className="text-xs bg-[#0b0e14] hover:bg-[#121824] px-3 py-1.5 border border-[#171e2c]">
                                                        {isEditingName ? 'SAVE' : 'EDIT'}
                                                    </button>
                                                </div>

                                                {/* Баланс */}
                                                <div className="bg-[#07090e] border border-[#121824] p-4 grid grid-cols-2 gap-4">
                                                    <div>
                                                        <p className="text-[10px] text-[#415373] font-bold uppercase tracking-wider mb-1">Telegram Stars</p>
                                                        <div className="flex items-center space-x-2">
                                                            <span className="text-base text-amber-500">★</span>
                                                            <span className="text-white font-bold text-base tracking-wider">{stars.toLocaleString()}</span>
                                                        </div>
                                                    </div>
                                                    <div className="border-l border-[#121824] pl-4">
                                                        <p className="text-[10px] text-[#415373] font-bold uppercase tracking-wider mb-1">TON Wallet Balance</p>
                                                        <div className="flex items-center space-x-2">
                                                            <span className="text-base text-cyan-400">💎</span>
                                                            <span className="text-white font-bold text-base tracking-wider">{tonBalance.toFixed(2)} TON</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Телефон */}
                                                <div className="bg-[#07090e] border border-[#121824] p-4">
                                                    <div className="flex-1 mr-4">
                                                        <p className="text-[10px] text-[#415373] font-bold uppercase tracking-wider mb-1">Основной Fragment Номер</p>
                                                        <p className="text-gray-300 text-sm">{mainNumber}</p>
                                                        <p className="text-[11px] text-gray-500 mt-2">
                                                            Номер можно изменить только покупкой в Fragment Market
                                                        </p>
                                                    </div>
                                                </div>

                                                {/* О себе */}
                                                <div className="bg-[#07090e] border border-[#121824] p-4 flex justify-between items-center">
                                                    <div className="flex-1 mr-4">
                                                        <p className="text-[10px] text-[#415373] font-bold uppercase tracking-wider mb-1">Биографическая Справка</p>
                                                        {isEditingBio ? (
                                                            <input type="text" value={bio} onChange={(e) => setBio(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && setIsEditingBio(false)} className="bg-[#05070a] border border-blue-500/40 px-2 py-1 text-white text-sm w-full focus:outline-none font-mono-premium"/>
                                                        ) : (
                                                            <p className="text-gray-400 text-sm italic">{bio}</p>
                                                        )}
                                                    </div>
                                                    <button onClick={() => setIsEditingBio(!isEditingBio)} className="text-xs bg-[#0b0e14] hover:bg-[#121824] px-3 py-1.5 border border-[#171e2c]">
                                                        {isEditingBio ? 'SAVE' : 'EDIT'}
                                                    </button>
                                                </div>

                                                {isAdmin && (
                                                    <div className="pt-2">
                                                        <button 
                                                            onClick={() => setShowAdminPanel(true)} 
                                                            className="w-full py-3 bg-[#0b0e14] border border-red-950 hover:bg-red-950/10 hover:border-red-900/60 text-red-500 text-xs font-bold tracking-widest transition-all uppercase"
                                                        >
                                                            [ Открыть панель разработчика FlapNet ]
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {/* БЛОК: ОТОБРАЖЕНИЕ КУПЛЕННЫХ NFT */}
                                    <div className="w-full bg-[#0b0e14] border border-[#121824] p-6 shadow-xl">
                                        <h3 className="text-xs font-bold tracking-widest text-[#415373] uppercase border-b border-[#121824] pb-3 mb-4 flex items-center justify-between">
                                            <span>🎁 Личные NFT Подарки / Коллекция</span>
                                            <span className="text-gray-500 font-mono-premium text-[11px]">Всего: {ownedGifts.length}</span>
                                        </h3>
                                        {ownedGifts.length === 0 ? (
                                            <div className="text-center py-8 border border-dashed border-[#171e2c] bg-[#07090e]/50">
                                                <p className="text-xs text-gray-500 italic">Коллекция пуста. Покупайте NFT во вкладке «Рынок».</p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3">
                                                {ownedGifts.map((gift) => (
                                                    <div key={gift.id} className="bg-[#07090e] border border-[#121824] p-3 flex flex-col items-center justify-center text-center rounded group hover:border-pink-500/20 transition-all shadow-inner">
                                                        <div className="w-16 h-16 flex items-center justify-center mb-2 bg-[#0b0e14]/50 rounded p-1">
                                                            <img src={gift.img} alt={gift.name} className="max-w-full max-h-full object-contain transform group-hover:scale-110 transition-transform duration-300" />
                                                        </div>
                                                        <span className="text-[10px] text-gray-300 truncate w-full font-bold uppercase block">{gift.name}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* ИНТЕРФЕЙС АДМИН ПАНЕЛИ */}
                            {activeTab === 'profile' && showAdminPanel && (
                                <div className="bg-[#0b0e14] border border-red-950 p-6 shadow-2xl space-y-6">
