<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Cal</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .flow-cal {
            background: rgba(18, 25, 32, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(72, 187, 255, 0.2);
            width: 100%;
            max-width: 380px;
        }

        .display {
            background: #0b1114;
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: right;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid #2d4a6e;
        }

        .expression {
            color: #6c8da8;
            font-size: 1rem;
            min-height: 28px;
            font-family: monospace;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .result {
            color: #b3f0ff;
            font-size: 3rem;
            font-weight: 600;
            line-height: 1.2;
            word-break: break-word;
            text-shadow: 0 0 3px rgba(0, 200, 255, 0.3);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            background: #1f2e3a;
            border: none;
            padding: 18px 0;
            font-size: 1.6rem;
            font-weight: 500;
            border-radius: 32px;
            color: #d9e9ff;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 #0e151c;
            font-family: monospace;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            border: 1px solid #3b5a74;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0e151c;
        }

        .operator {
            background: #2c4c6e;
            color: #aaf0ff;
            font-weight: bold;
            font-size: 1.8rem;
            border-color: #5c9acf;
        }

        .equals {
            background: #1f7b8a;
            color: white;
            font-weight: bold;
            box-shadow: 0 5px 0 #0e4e58;
            border-color: #34cce5;
        }

        .clear {
            background: #4a2c2c;
            color: #ffb7b7;
            border-color: #aa6f6f;
        }

        .zero {
            grid-column: span 2;
        }

        .brand {
            text-align: center;
            margin-top: 16px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #4a7c9c;
            font-weight: 300;
        }
    </style>
</head>
<body>
<div class="flow-cal">
    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
        <button class="clear" data-action="clear">C</button>
        <button data-action="delete">⌫</button>
        <button class="operator" data-op="%">%</button>
        <button class="operator" data-op="/">÷</button>

        <button data-num="7">7</button>
        <button data-num="8">8</button>
        <button data-num="9">9</button>
        <button class="operator" data-op="*">×</button>

        <button data-num="4">4</button>
        <button data-num="5">5</button>
        <button data-num="6">6</button>
        <button class="operator" data-op="-">–</button>

        <button data-num="1">1</button>
        <button data-num="2">2</button>
        <button data-num="3">3</button>
        <button class="operator" data-op="+">+</button>

        <button class="zero" data-num="0">0</button>
        <button data-num=".">.</button>
        <button class="equals" data-action="equals">=</button>
    </div>
    <div class="brand">FLOW CAL // fluid precision</div>
</div>

<script>
    // Состояние калькулятора
    let currentInput = '0';     // то, что набираем сейчас
    let previousInput = '';      // предыдущее значение
    let operator = null;         // текущий оператор
    let shouldResetScreen = false;

    const expressionDiv = document.getElementById('expression');
    const resultDiv = document.getElementById('result');

    function updateDisplay() {
        resultDiv.innerText = currentInput;
        if (operator && previousInput !== '') {
            expressionDiv.innerText = `${previousInput} ${operator} ${currentInput}`;
        } else if (previousInput !== '' && !operator) {
            expressionDiv.innerText = previousInput;
        } else {
            expressionDiv.innerText = '';
        }
    }

    function appendNumber(number) {
        if (shouldResetScreen) {
            currentInput = '';
            shouldResetScreen = false;
        }
        if (number === '.' && currentInput.includes('.')) return;
        if (currentInput === '0' && number !== '.') {
            currentInput = number;
        } else {
            currentInput += number;
        }
        updateDisplay();
    }

    function chooseOperator(op) {
        if (operator !== null && !shouldResetScreen) {
            compute();
        }
        previousInput = currentInput;
        operator = op;
        shouldResetScreen = true;
        updateDisplay();
    }

    function compute() {
        if (operator === null || shouldResetScreen) return;
        let computation;
        const prev = parseFloat(previousInput);
        const current = parseFloat(currentInput);

        if (isNaN(prev) || isNaN(current)) return;

        switch (operator) {
            case '+':
                computation = prev + current;
                break;
            case '-':
                computation = prev - current;
                break;
            case '*':
                computation = prev * current;
                break;
            case '/':
                if (current === 0) {
                    currentInput = 'Error';
                    previousInput = '';
                    operator = null;
                    updateDisplay();
                    return;
                }
                computation = prev / current;
                break;
            case '%':
                computation = prev % current;
                break;
            default:
                return;
        }
        currentInput = String(computation);
        operator = null;
        previousInput = '';
        shouldResetScreen = true;
        updateDisplay();
    }

    function clearAll() {
        currentInput = '0';
        previousInput = '';
        operator = null;
        shouldResetScreen = false;
        updateDisplay();
    }

    function deleteLast() {
        if (shouldResetScreen) {
            clearAll();
            return;
        }
        if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
            currentInput = '0';
        } else {
            currentInput = currentInput.slice(0, -1);
        }
        updateDisplay();
    }

    // Обработка нажатий (делегирование)
    document.querySelector('.buttons').addEventListener('click', (e) => {
        const btn = e.target;
        if (!btn.matches('button')) return;

        if (btn.hasAttribute('data-num')) {
            appendNumber(btn.getAttribute('data-num'));
        }
        else if (btn.hasAttribute('data-op')) {
            chooseOperator(btn.getAttribute('data-op'));
        }
        else if (btn.getAttribute('data-action') === 'clear') {
            clearAll();
        }
        else if (btn.getAttribute('data-action') === 'delete') {
            deleteLast();
        }
        else if (btn.getAttribute('data-action') === 'equals') {
            compute();
        }
    });

    // Клавиатурная поддержка
    window.addEventListener('keydown', (e) => {
        const key = e.key;
        if (/[0-9]/.test(key)) {
            appendNumber(key);
        } else if (key === '.') {
            appendNumber('.');
        } else if (key === '+' || key === '-' || key === '*' || key === '/') {
            let op = key;
            if (key === '/') op = '/';
            if (key === '*') op = '*';
            chooseOperator(op);
        } else if (key === '%') {
            chooseOperator('%');
        } else if (key === 'Enter' || key === '=') {
            e.preventDefault();
            compute();
        } else if (key === 'Escape') {
            clearAll();
        } else if (key === 'Backspace') {
            deleteLast();
        }
    });
</script>
</body>
</html>
